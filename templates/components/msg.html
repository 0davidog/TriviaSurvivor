<div id="msg-container">
{% for message in messages %}
  <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert">

    <button type="button" data-bs-dismiss="alert" aria-label="Close" class="btn-close"></button>

    <h3 class="title-font">
      <i class="
        fa-solid 
        {% if message.tags == 'success' %}fa-circle-check
        {% elif message.tags == 'warning' %}fa-circle-exclamation
        {% elif message.tags == 'error' %}fa-triangle-exclamation
        {% elif messages.tags == 'info' %}fa-circle-info
        {% elif messages.tags == 'debug' %}fa-bug
        {% endif %}
        " id="msg-icon"></i> {{ message.tags | title }}!
    </h3>
    
    <hr>

    <p>{{ message | safe }}</p>

  </div>
</div>
{% endfor %}
