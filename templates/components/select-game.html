<div class="carousel hidden" id="select-game">

    <h1 class="title-font">Choose Genre</h1>

        {% for genre in genres %}
        <div class="slide {% if forloop.first %}active{% endif %}">
            <img src="{{ genre.button_background}}" class="genre-img" alt="">
            <h1 class="title-font">{{ genre | upper }}</h1>
            <button class="btn main-menu-btn genre-select-btn" data-genre="{{ genre }}">Select</button>
        </div>
        {% endfor %}

    <div class="container carousel-buttons">
        <div><button class="btn" id="prev">&lt;</button></div>
        <div></div>
        <div><button class="btn" id="next">&gt;</button> </div>
    </div>

</div>
